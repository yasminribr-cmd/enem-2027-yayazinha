<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Plano ENEM 2027</title><script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--sf:#fffcf6;--cd:#ebe3d7;--tx:#141414;--mu:#7a7566;--bd:#e0d7c5;--ac:#141414;--on:#fff;--pk:#f4a8d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151512;--sf:#1e1e1a;--cd:#2a2a24;--tx:#f1eee3;--mu:#a29d8c;--bd:#34332c;--ac:#f1eee3;--on:#141414;color-scheme:dark}}
:root[data-theme=dark]{--bg:#151512;--sf:#1e1e1a;--cd:#2a2a24;--tx:#f1eee3;--mu:#a29d8c;--bd:#34332c;--ac:#f1eee3;--on:#141414;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3,button,.tag,.big,.logo{font-family:Outfit,system-ui,sans-serif}h2{font-size:17px;font-weight:600;margin:0 0 10px}
.shell{display:grid;grid-template-columns:76px minmax(0,1fr) 300px;gap:18px;padding:16px;align-items:start;max-width:1560px;margin:0 auto}
.mn{min-width:0;padding:6px 4px}
aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));height:calc(100vh - 32px);background:var(--cd);border-radius:32px;padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{font-size:24px;font-weight:700}.logo b{color:var(--pk)}
#nav{display:flex;flex-direction:column;gap:10px}
#nav button{width:48px;height:48px;padding:0;font-size:19px;display:grid;place-items:center}
#side{display:grid;gap:14px;align-content:start;background:var(--cd);border-radius:32px;padding:16px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}
h1{font-size:46px;font-weight:500;line-height:1.05;letter-spacing:-1.5px;margin:4px 0 8px}
.tl{font-size:13px;color:var(--mu);margin-top:10px}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.acct .email{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct button{font-size:12px}.account-note{font-size:12px;color:var(--mu);margin:0 0 4px}.account-ok{background:#cfe5c6;color:#141414;border-radius:14px;padding:9px 11px;font-size:12px}
.hero{background:var(--ac);color:var(--on);border-radius:24px;padding:16px}.hero .mu{color:inherit;opacity:.7}.big{font-size:34px;font-weight:600;line-height:1.1}
.cal{background:var(--sf);border-radius:24px;padding:12px;font-size:12px}
.ch{display:flex;justify-content:space-between;align-items:center;text-transform:capitalize;margin-bottom:4px}.ch button{padding:0 8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.cg span.td{background:var(--ac);color:var(--on);border-radius:99px}.cg span.ex{background:var(--pk);color:#141414;border-radius:99px}
button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:13px;white-space:nowrap}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chips,.wk{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.chips{margin-bottom:6px}.chips button{padding:9px 16px;background:var(--cd);border-color:transparent}.chips button.on{background:var(--ac)}.wk button{font-size:12px;padding:5px 12px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}.sp{flex:1}
.board{display:grid;gap:12px;overflow-x:auto}.board.d{grid-template-columns:repeat(7,minmax(210px,1fr))}.board.k{grid-template-columns:repeat(4,minmax(230px,1fr))}
.col{min-height:160px}.col h3{background:var(--sf);border-radius:18px;padding:10px 12px;text-align:center;font-size:13px;font-weight:500;margin:0 0 10px}.col h3.td{background:var(--ac);color:var(--on)}
.card{--c:#888;background:color-mix(in srgb,var(--c) 24%,var(--sf));color:var(--tx);border-radius:26px;padding:14px;margin-bottom:10px;cursor:grab}
.card.st-f{opacity:.6}.card.st-f .ct{text-decoration:line-through}
.chip{display:inline-block;background:var(--sf);border-radius:99px;padding:2px 10px;font-size:11px;margin:0 4px 4px 0}
.ic{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sf);margin:0 6px 4px 0;font-size:12px;vertical-align:middle}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:500;margin:0 4px 4px 0}
.ct{font-size:14px;margin:4px 0 10px}.cr{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.cr select{flex:1;min-width:0}.cr button{padding:2px 8px}
select,input{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:5px 8px}
