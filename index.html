async function accountCreate(email,password){
  if(!currentUser?.is_anonymous){return {error:{message:"Você já está conectado a uma conta."}}}
  if(!email||!password)return {error:{message:"Preencha e-mail e senha."}};
  if(password.length<6)return {error:{message:"A senha precisa ter pelo menos 6 caracteres."}};
  const r=await sb.auth.updateUser({email,password},{emailRedirectTo:window.location.href});
  if(!r.error)currentUser=r.data.user;
  return r;
}

async function accountLogin(email,password){
  if(!email||!password)return {error:{message:"Preencha e-mail e senha."}};
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error)return r;
  await loadUserData(r.data.user);
  return r;
}

async function accountLogout(){
  const r=await sb.auth.signOut();
  if(r.error)throw r.error;
  dbId=null;currentUser=null;S={c:{},u:[],l:[],sm:[],er:[],rd:[],fd:{},rv:{},mt:[700,750,720,800,800],rp:[]};

  await loadUserData(a.data.user);
}
